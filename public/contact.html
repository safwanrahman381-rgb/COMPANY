<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact</title>
  <meta name="description" content="Clinical-strength skincare treatments, delivered discreetly across the UK.">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="site-header"></div>
  <main id="main">
    <div class="container">
      <header class="page-head">
        <p class="eyebrow">Contact</p>
        <h1>We're here <em>to help</em></h1>
        <p>Questions about a product, your order or which strength to choose? Send us a message.</p>
      </header>
      <div class="contact-grid">
        <div>
          <div class="contact-card"><h3>Email</h3><p data-contact-email></p></div>
          <div class="contact-card"><h3>Response time</h3><p>We reply within 1 working day, Monday to Friday.</p></div>
          <div class="contact-card"><h3>Order questions</h3><p>Include your order reference (it's in your confirmation email) so we can help faster.</p></div>
        </div>
        <div>
          <div id="contact-status" aria-live="polite"></div>
          <form id="contact-form" novalidate>
            <div class="field"><label for="c-name">Name</label><input class="input" id="c-name" name="name" required autocomplete="name"></div>
            <div class="field"><label for="c-email">Email</label><input class="input" id="c-email" name="email" type="email" required autocomplete="email"></div>
            <div class="field"><label for="c-order">Order reference (optional)</label><input class="input" id="c-order" name="orderNumber"></div>
            <div class="field"><label for="c-message">Message</label><textarea class="textarea" id="c-message" name="message" required></textarea></div>
            <div class="visually-hidden" aria-hidden="true"><label for="c-website">Leave this empty</label><input id="c-website" name="website" tabindex="-1" autocomplete="off"></div>
            <button class="btn" type="submit">Send message</button>
          </form>
        </div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="/js/app.js"></script>
  <script src="/js/contact.js"></script>
</body>
</html>
